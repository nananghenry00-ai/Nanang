<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Location Tracker</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>
    <style>
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Phone Location Tracker</h1>
    <input type="text" id="phoneNumber" placeholder="Enter phone number" />
    <button id="trackButton">Track Location</button>
    
    <div id="map"></div>

    <script>
        function initMap() {
            var map = new google.maps.Map(document.getElementById('map'), {
                center: {lat: -34.397, lng: 150.644},
                zoom: 8
            });
        }

        document.getElementById('trackButton').addEventListener('click', function() {
            var phoneNumber = document.getElementById('phoneNumber').value;
            // Implement API call for tracking and operator detection here
            // Update the map based on the location received
            alert('Tracking location for: ' + phoneNumber);
        });

        window.onload = initMap;
    </script>
</body>
</html>
